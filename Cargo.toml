[workspace]
resolver = "2"
members = ["contract"]

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

# ed25519-dalek 3.x broke CryptoRng vs ChaCha20Rng used by soroban-env-host 22.
# Pin 2.2.0 from upstream git (no local vendor/ tree).
[patch.crates-io]
ed25519-dalek = { git = "https://github.com/dalek-cryptography/curve25519-dalek", rev = "8016d6d9b9cdbaa681f24147e0b9377cc8cef934" }
