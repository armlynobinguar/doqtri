name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Contract tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Run unit tests
        run: cargo test -p doqtri-registry

  build:
    name: Build WASM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      - name: Install Stellar CLI
        env:
          STELLAR_CLI_VERSION: "25.2.0"
        run: |
          set -euo pipefail
          asset="stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          url="https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/${asset}"
          curl -fsSL "$url" -o /tmp/stellar-cli.tar.gz
          tar -xzf /tmp/stellar-cli.tar.gz -C /tmp
          sudo install -m 755 /tmp/stellar /usr/local/bin/stellar
          stellar --version

      - name: Build contract
        run: stellar contract build
        working-directory: contract

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: doqtri-registry-wasm
          path: target/wasm32v1-none/release/doqtri_registry.wasm
          if-no-files-found: error

  app:
    name: App build + unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: doqtri/frontend
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://omoalynhmtbqffogjvoy.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-4o
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: doqtri/frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build
        run: |
          if [ -z "${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}" ]; then
            export NEXT_PUBLIC_SUPABASE_ANON_KEY=ci-placeholder-anon-key
          fi
          npm run build
