name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Contract tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Run unit tests
        run: cargo test -p doqtri-registry

  build:
    name: Build WASM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      - name: Install Stellar CLI
        env:
          STELLAR_CLI_VERSION: "25.2.0"
        run: |
          set -euo pipefail
          asset="stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          url="https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/${asset}"
          curl -fsSL "$url" -o /tmp/stellar-cli.tar.gz
          tar -xzf /tmp/stellar-cli.tar.gz -C /tmp
          sudo install -m 755 /tmp/stellar /usr/local/bin/stellar
          stellar --version

      - name: Build contract
        run: stellar contract build
        working-directory: contract

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: doqtri-registry-wasm
          path: target/wasm32v1-none/release/doqtri_registry.wasm
          if-no-files-found: error

  web:
    name: Web build + Playwright
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      NEXT_PUBLIC_CONTRACT_ID: CBWQV275C4MXYKRTFGAUD6FUJX2UHOE7D6LSKTTYYQ7ZBPM3KJSAQZWH
      NEXT_PUBLIC_SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
      NEXT_PUBLIC_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
      NEXT_PUBLIC_HORIZON_URL: https://horizon-testnet.stellar.org
      NEXT_PUBLIC_EXPERT_TX_BASE: https://stellar.expert/explorer/testnet/tx
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke — vault gate
        run: npx playwright test e2e/vault-gate.spec.ts

      - name: Build with E2E wallet stub
        env:
          NEXT_PUBLIC_E2E_ADDRESS: GAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAWHF
        run: npm run build

      - name: Smoke — create doc
        env:
          NEXT_PUBLIC_E2E_ADDRESS: GAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAWHF
          PLAYWRIGHT_E2E: "1"
        run: npx playwright test e2e/create-doc.spec.ts
