version: 2
updates:
  # The Next.js app. Security fixes arrive as soon as they are published;
  # routine updates come grouped once a week.
  - package-ecosystem: npm
    directory: /doqtri/frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # The Soroban contracts (registry + market workspace, and fee-forwarder).
  - package-ecosystem: cargo
    directories: [/, /fee-forwarder]
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
